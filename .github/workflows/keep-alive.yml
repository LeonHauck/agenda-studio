# Mantém o projeto do Supabase ativo.
# No plano gratuito, o Supabase pausa projetos com pouca atividade. Esta tarefa roda
# várias vezes por dia e: (1) grava um "batimento" no banco (função keep_alive),
# (2) consulta os horários livres como a página das clientes faz e (3) verifica o login.
# Se o banco não responder, a tarefa falha e o GitHub envia um e-mail de aviso.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 */4 * * *'  # a cada 4 horas (6 vezes por dia)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  actions: write             # para reativar esta própria tarefa (ver último passo)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Movimentar o banco (Supabase)
        run: |
          # URL e chave pública lidas do próprio site, sem duplicar configuração
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" js/config.js)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" js/config.js)
          H=(-H "apikey: $KEY" -H "Content-Type: application/json")

          ok=0
          for i in 1 2 3; do
            # 1. Escrita: atualiza o batimento
            code=$(curl -s -o batimento.json -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keep_alive" "${H[@]}" -d '{}')
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "Tentativa $i falhou (HTTP $code): $(cat batimento.json)"
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::O Supabase não respondeu. O projeto pode estar pausado: abra o painel do Supabase e clique em Restore project."
            exit 1
          fi
          echo "Batimento gravado: $(cat batimento.json)"

          # 2. Leitura: horários ocupados dos próximos dias (mesma consulta da página das clientes)
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          FIM=$(TZ=America/Sao_Paulo date -d '+30 days' +%F)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/busy_slots" "${H[@]}" \
            -d "{\"p_from\":\"$HOJE\",\"p_to\":\"$FIM\"}")
          echo "Consulta de horários: HTTP $code"

          # 3. Serviço de login (Auth)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/auth/v1/settings" -H "apikey: $KEY")
          echo "Serviço de login: HTTP $code"

      # O GitHub desativa tarefas agendadas de repositórios sem commits há 60 dias.
      # Reativar a cada execução evita que a tarefa pare sozinha.
      - name: Manter esta tarefa ativa no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
